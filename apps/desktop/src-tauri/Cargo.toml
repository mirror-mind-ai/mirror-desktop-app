[package]
name = "mirror-desktop"
version = "0.0.0"
description = "Mirror Desktop — the first-party desktop application for Mirror Mind"
authors = ["Mirror Mind"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mirror_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.dev]
# Line tables are enough for our own backtraces; full debuginfo for every
# dependency turns target/ into tens of GiB (a lesson Kia Desktop paid for).
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
